name: gaiji_app
description: "外字登録アプリ - お寺の住職向け漢字切り取り・保存アプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # カメラ・画像選択
  image_picker: ^1.1.2

  # 画像処理
  image: ^4.2.0

  # ファイル保存・パス管理
  path_provider: ^2.1.4
  path: ^1.9.0

  # パーミッション管理
  permission_handler: ^11.3.1

  # 共有機能
  share_plus: ^10.0.0

  # ローカルDB（外字ライブラリ管理）- Web対応版
  hive: 2.2.3
  hive_flutter: 1.1.0

  # UUID生成
  uuid: ^4.5.1

  # 共有設定
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
